<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a2b">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%23101a2b'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='serif' font-weight='bold' font-size='49' fill='%23f4bd53'%3E%CE%A3%3C/text%3E%3C/svg%3E">
  <title>指數・對數卡片挑戰</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./game.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-icon">∑</span><div><h1>指數・對數卡片挑戰</h1><p>三人同時挑戰 · 各區獨立計時</p></div></div>
      <div class="top-actions">
        <span id="rulesSummary" class="rules-summary"></span>
        <button id="settingsButton" class="toolbar-button" type="button">⚙ 教師設定</button>
        <button id="fullscreenButton" class="toolbar-button" type="button">⛶ 全螢幕</button>
      </div>
    </header>
    <main id="lanes" class="lanes" aria-label="三人遊戲區"></main>
  </div>

  <dialog id="settingsDialog" class="settings-dialog">
    <form id="settingsForm" method="dialog">
      <div class="dialog-top"><div><h2>教師設定</h2><p>修改後套用於下一位開始遊玩的學生；正在作答的回合沿用原設定。</p></div><button class="close-button" type="button" id="closeSettings" aria-label="關閉設定">×</button></div>
      <fieldset class="subject-options"><legend>題目內容（可複選）</legend>
        <label><input type="checkbox" name="exp" checked> 指數運算</label>
        <label><input type="checkbox" name="log" checked> 常用對數</label>
      </fieldset>
      <div class="settings-grid">
        <div class="setting-row"><span class="level-pill easy">簡單</span><label>題數<input type="number" name="easyCount" min="0" max="30" value="4" inputmode="numeric"></label><label>候選卡片<input type="number" name="easyCandidates" min="8" max="24" value="12" inputmode="numeric"></label><label>每題秒數<input type="number" name="easySeconds" min="5" max="180" value="20" inputmode="numeric"></label></div>
        <div class="setting-row"><span class="level-pill medium">中等</span><label>題數<input type="number" name="mediumCount" min="0" max="30" value="4" inputmode="numeric"></label><label>候選卡片<input type="number" name="mediumCandidates" min="8" max="24" value="12" inputmode="numeric"></label><label>每題秒數<input type="number" name="mediumSeconds" min="5" max="180" value="40" inputmode="numeric"></label></div>
        <div class="setting-row"><span class="level-pill hard">困難</span><label>題數<input type="number" name="hardCount" min="0" max="30" value="2" inputmode="numeric"></label><label>候選卡片<input type="number" name="hardCandidates" min="8" max="24" value="12" inputmode="numeric"></label><label>每題秒數<input type="number" name="hardSeconds" min="5" max="180" value="60" inputmode="numeric"></label></div>
      </div>
      <p class="setting-help">簡單選 2 張、中等選 3 張、困難選 4 張。各難度可分別設定 8～24 張候選卡片，預設皆為 12 張。每題至少有 3 種不同的正確組合。計分為答對當下的剩餘秒數。</p>
      <p id="settingsError" class="settings-error" role="alert"></p>
      <div class="dialog-actions"><span id="questionTotal">共 10 題</span><button class="save-button" type="submit">儲存設定</button></div>
    </form>
  </dialog>
</body>
</html>
